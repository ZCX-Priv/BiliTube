<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiliTube</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="logo-container">
      <div class="logo-icon"></div>
      <div class="logo-text">
        <span>Bili</span><span>Tube</span>
      </div>
    </div>
    <div class="loading-text" id="loading-status">初始化中</div>
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="menu-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <a href="#/home" class="brand-logo">
        <span class="bili">Bili</span><span class="tube">Tube</span>
      </a>
    </div>

    <div class="header-center">
      <div class="search-bar">
        <input type="text" class="search-input" placeholder="搜索">
        <button class="search-btn">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>
      <div class="search-suggestions" id="search-suggestions">
        <!-- Suggestions populated by JS -->
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn search-icon-mobile" id="search-toggle-mobile" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme-toggle" title="切换深色模式">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" id="theme-icon">
          <!-- Moon Icon (Default) -->
          <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar -->
    <nav class="sidebar">
      <a href="#/home" class="sidebar-link active">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>首页</span>
      </a>
      <a href="#/subscriptions" class="sidebar-link">
        <svg viewBox="0 0 24 24"><path d="M18.7 8.7H5.3V7h13.4v1.7zm-1.7-5.3H7v1.7h10V3.4zm3.3 8.6H3.7V22h16.6V12zm-1.7 8.3H5.3v-6.6h13.4v6.6z"/></svg>
        <span>订阅</span>
      </a>
      <a href="#/profile" class="sidebar-link">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>我的</span>
      </a>
      
      <div class="sidebar-divider"></div>
      
      <!-- More sidebar items can go here -->
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <section id="view-home" class="view active">
        <div class="tags-bar">
          <div class="tag-chip active">全部</div>
          <div class="tag-chip">推荐</div>
          <div class="tag-chip">热门</div>
        </div>

        <div class="video-grid" id="video-grid">
        </div>
      </section>

      <section id="view-subscriptions" class="view" hidden>
        <div class="subs-container">
          <div class="subs-list">
          </div>
          
          <div class="subs-content">
          </div>
        </div>
      </section>

      <section id="view-profile" class="view" hidden>
        <div class="profile-header">
          <div class="profile-avatar"></div>
          <div class="profile-info">
            <h1></h1>
            <p></p>
          </div>
        </div>

        <div class="profile-tabs">
          <button class="tab-btn active" data-tab="recent">最近观看</button>
          <button class="tab-btn" data-tab="favorites">收藏</button>
          <button class="tab-btn" data-tab="settings">设置</button>
        </div>

        <div id="recent" class="tab-content active">
          <div class="profile-history-header">
            <span>观看历史</span>
            <button type="button" class="history-clear-btn" data-action="history-clear">清空历史</button>
          </div>
          <div class="timeline" id="recent-grid">
          </div>
        </div>
        <div id="favorites" class="tab-content"></div>
        <div id="settings" class="tab-content"></div>
      </section>

      <section id="view-video" class="view" hidden>
        <div class="video-page-container">
          <div class="video-main">
            <div class="btube-video-layout">
              <div class="btube-video-section">
                <div class="btube-video-container">
                  <video
                    id="btube-video"
                    class="btube-video-element"
                    controls
                    playsinline
                    webkit-playsinline
                    preload="metadata"
                    data-quality="hd"
                  >
                    您的浏览器不支持 HTML5 视频。
                  </video>
                  <div id="btube-danmaku-layer" class="btube-danmaku-layer"></div>
                  <div id="btube-video-error" class="btube-video-error"></div>
                </div>
              </div>

              <aside class="btube-right-panel">
                <div class="btube-panel-header">
                  <div class="btube-tabs">
                    <button type="button" class="btube-tab active" data-tab="details">视频详情</button>
                    <button type="button" class="btube-tab" data-tab="comments">评论区</button>
                  </div>
                  <div class="btube-header-actions">
                    <button type="button" class="btube-icon-btn btube-panel-toggle" data-action="toggle-panel">
                      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M3 6h18v2H3V6zm0 5h12v2H3v-2zm0 5h18v2H3v-2z"/>
                      </svg>
                    </button>
                    <button type="button" class="btube-icon-btn video-back-btn" data-action="video-back" aria-label="返回">
                      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                      </svg>
                    </button>
                  </div>
                </div>

                <div class="btube-panel-body">
                  <div id="btube-details-content">
                    <div class="btube-panel-video-controls">
                      <button type="button" class="btube-control-chip" id="btube-quality-toggle">
                        <span class="btube-chip-icon">HD</span>
                        <span class="btube-control-label">高清</span>
                      </button>
                      <button type="button" class="btube-control-chip" id="btube-danmaku-toggle">
                        <span class="btube-chip-icon">弹</span>
                        <span>弹幕开关</span>
                      </button>
                    </div>

                    <div class="btube-author-card">
                      <div class="btube-avatar" id="btube-author-avatar">A</div>
                      <div class="btube-author-info">
                        <div class="btube-author-name" id="btube-author-name">视频作者名称</div>
                        <div class="btube-author-bio" id="btube-author-bio">这里是作者的简介信息，通常比较简短。</div>
                      </div>
                    </div>

                    <div class="btube-video-info">
                      <h1 class="btube-video-title" id="btube-video-title">10 分钟搭建一个网站</h1>
                      <div class="btube-video-desc" id="btube-video-desc">
                        在本视频中，我们将用 10 分钟搭建一个响应式网站，适合想要入门前端开发的同学。
                      </div>
                    </div>

                    <div class="btube-episodes" id="btube-episodes"></div>

                    <div class="btube-recommendations" id="btube-recommendations"></div>
                  </div>

                  <div id="btube-comments-content" class="btube-comments-section"></div>
                </div>
              </aside>
            </div>
          </div>
        </div>
      </section>

      <section id="view-search" class="view" hidden>
        <div class="search-results-header">
          <button class="back-home-btn" id="search-back">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span>返回首页</span>
          </button>
          <div class="search-keyword-box">
            <span id="search-keyword-label"></span>
          </div>
        </div>

        <div class="search-tabs">
          <button class="search-tab active" data-type="videos">视频</button>
          <button class="search-tab" data-type="users">用户</button>
        </div>

        <div id="search-results-videos" class="search-results-videos active">
          <div class="video-grid" id="search-video-grid"></div>
        </div>

        <div id="search-results-users" class="search-results-users">
          <div id="search-user-list" class="user-list-row"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="btube-modal" class="btube-modal" hidden>
    <div class="btube-modal-backdrop"></div>
    <div class="btube-modal-dialog">
      <div class="btube-modal-title" id="btube-modal-title"></div>
      <div class="btube-modal-body" id="btube-modal-body"></div>
      <div class="btube-modal-actions">
        <button type="button" class="btube-modal-btn btube-modal-btn-secondary" data-action="modal-cancel">取消</button>
        <button type="button" class="btube-modal-btn btube-modal-btn-primary" data-action="modal-confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="js/home.js"></script>
  <script src="js/subscribe.js"></script>
  <script src="js/search.js"></script>
  <script src="js/player.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
