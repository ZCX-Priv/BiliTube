<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/BiliTube.png" type="image/png">
  <meta name="description" content="BiliTube - 一个基于 Bilibili API 、YouTube风格的视频播放平台">
  <meta name="keywords" content="Bilibili,视频播放,视频平台">
  <title>BiliTube</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 加载页面 -->
  <div id="loading-screen">
    <div class="logo-container">
      <div class="logo-icon"></div>
      <div class="logo-text">
        <span>Bili</span><span>Tube</span>
      </div>
    </div>
    <div class="loading-text" id="loading-status">初始化中</div>
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- 头部 -->
  <header class="app-header">
    <div class="header-left">
      <button class="menu-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <a href="#/home" class="brand-logo">
        <img src="img/BiliTube-Font.png" alt="BiliTube" class="brand-img">
      </a>
    </div>

    <div class="header-center">
      <div class="search-bar">
        <input type="text" class="search-input" placeholder="搜索">
        <button class="search-btn">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>
      <div class="search-suggestions" id="search-suggestions">
        <!-- 搜索建议 -->
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn search-icon-mobile" id="search-toggle-mobile" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme-toggle" title="切换深色模式">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" id="theme-icon">
          <!-- 月亮图标 -->
          <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="app-container">
    <!-- 侧边栏 -->
    <nav class="sidebar">
      <a href="#/home" class="sidebar-link active">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>首页</span>
      </a>
      <a href="#/subscriptions" class="sidebar-link">
        <svg viewBox="0 0 24 24"><path d="M18.7 8.7H5.3V7h13.4v1.7zm-1.7-5.3H7v1.7h10V3.4zm3.3 8.6H3.7V22h16.6V12zm-1.7 8.3H5.3v-6.6h13.4v6.6z"/></svg>
        <span>订阅</span>
      </a>
      <a href="#/profile" class="sidebar-link">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>我的</span>
      </a>
      
      <div class="sidebar-divider"></div>
      
      <!-- More sidebar items can go here -->
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
      <section id="view-home" class="view active">
        <div class="tags-bar">
          <div class="tag-chip active">全部</div>
          <div class="tag-chip">推荐</div>
          <div class="tag-chip">热门</div>
        </div>

        <div class="video-grid" id="video-grid">
        </div>
      </section>

      <section id="view-subscriptions" class="view" hidden>
        <div class="subs-container">
          <div class="subs-list">
          </div>
          
          <div class="subs-content">
          </div>
        </div>
      </section>

      <section id="view-profile" class="view" hidden>
        <div class="profile-header">
          <div class="profile-avatar"></div>
          <div class="profile-info">
            <h1></h1>
            <p></p>
          </div>
        </div>

        <div class="profile-tabs">
          <button class="tab-btn active" data-tab="recent">最近观看</button>
          <button class="tab-btn" data-tab="favorites">收藏</button>
          <button class="tab-btn" data-tab="settings">设置</button>
        </div>

        <div id="recent" class="tab-content active">
          <div class="profile-history-header">
            <span>观看历史</span>
            <button type="button" class="history-clear-btn" data-action="history-clear">清空历史</button>
          </div>
          <div class="timeline" id="recent-grid">
          </div>
        </div>
        <div id="favorites" class="tab-content"></div>
        <div id="settings" class="tab-content"></div>
      </section>

      <section id="view-video" class="view" hidden>
        <div class="video-page-container">
          <div class="video-main">
            <div class="BiliTube-video-layout">
              <div class="BiliTube-video-section">
                <div class="BiliTube-video-container">
                  <video
                    id="BiliTube-video"
                    class="BiliTube-video-element"
                    controls
                    playsinline
                    webkit-playsinline
                    preload="metadata"
                    data-quality="hd"
                  >
                    您的浏览器不支持 HTML5 视频。
                  </video>
                  <div id="BiliTube-danmaku-layer" class="BiliTube-danmaku-layer"></div>
                  <div id="BiliTube-video-error" class="BiliTube-video-error"></div>
                </div>
              </div>

              <aside class="BiliTube-right-panel">
                <div class="BiliTube-panel-header">
                  <div class="BiliTube-tabs">
                    <button type="button" class="BiliTube-tab active" data-tab="details">视频详情</button>
                    <button type="button" class="BiliTube-tab" data-tab="comments">评论区</button>
                  </div>
                  <div class="BiliTube-header-actions">
                    <button type="button" class="BiliTube-icon-btn BiliTube-panel-toggle" data-action="toggle-panel">
                      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M3 6h18v2H3V6zm0 5h12v2H3v-2zm0 5h18v2H3v-2z"/>
                      </svg>
                    </button>
                    <button type="button" class="BiliTube-icon-btn video-back-btn" data-action="video-back" aria-label="返回">
                      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                      </svg>
                    </button>
                  </div>
                </div>

                <div class="BiliTube-panel-body">
                  <div id="BiliTube-details-content">
                    <div class="BiliTube-panel-video-controls">
                      <button type="button" class="BiliTube-action-btn" data-action="like">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                          <path d="M1 21h4V9H1v12zM23 10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14 1 7.59 7.41C7.22 7.78 7 8.3 7 8.83V19c0 1.1.9 2 2 2h8c.83 0 1.54-.5 1.84-1.22l3-7.05c.1-.23.16-.48.16-.73V10z"/>
                        </svg>
                        <span>点赞</span>
                      </button>
                      <button type="button" class="BiliTube-action-btn" data-action="favorite">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                        <span>收藏</span>
                      </button>
                      <button type="button" class="BiliTube-action-btn" data-action="coin">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                          <path d="M12 2C6.48 2 2 4.69 2 8v8c0 3.31 4.48 6 10 6s10-2.69 10-6V8c0-3.31-4.48-6-10-6zm0 2c4.41 0 8 1.79 8 4s-3.59 4-8 4-8-1.79-8-4 3.59-4 8-4zm0 14c-4.41 0-8-1.79-8-4v-2.05C5.19 13.22 8.35 14 12 14s6.81-.78 8-2.05V14c0 2.21-3.59 4-8 4z"/>
                        </svg>
                        <span>投币</span>
                      </button>
                    </div>

                    <div class="BiliTube-author-card">
                      <div class="BiliTube-avatar" id="BiliTube-author-avatar"></div>
                      <div class="BiliTube-author-info">
                        <div class="BiliTube-author-name" id="BiliTube-author-name"></div>
                        <div class="BiliTube-author-bio" id="BiliTube-author-bio"></div>
                      </div>
                    </div>

                    <div class="BiliTube-video-info">
                      <h1 class="BiliTube-video-title" id="BiliTube-video-title"></h1>
                      <div class="BiliTube-video-meta" id="BiliTube-video-meta"></div>
                      <div class="BiliTube-video-desc" id="BiliTube-video-desc"></div>
                    </div>

                    <div class="BiliTube-episodes" id="BiliTube-episodes"></div>

                    <div class="BiliTube-recommendations" id="BiliTube-recommendations"></div>
                  </div>

                  <div id="BiliTube-comments-content" class="BiliTube-comments-section"></div>
                </div>
              </aside>
            </div>
          </div>
        </div>
      </section>

      <section id="view-search" class="view" hidden>
        <div class="search-results-header">
          <button class="back-home-btn" id="search-back">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span>返回首页</span>
          </button>
          <div class="search-keyword-box">
            <span id="search-keyword-label"></span>
          </div>
        </div>

        <div class="search-tabs">
          <button class="search-tab active" data-type="videos">视频</button>
          <button class="search-tab" data-type="users">用户</button>
        </div>

        <div id="search-results-videos" class="search-results-videos active">
          <div class="video-grid" id="search-video-grid"></div>
        </div>

        <div id="search-results-users" class="search-results-users">
          <div id="search-user-list" class="user-list-row"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="BiliTube-modal" class="BiliTube-modal" hidden>
    <div class="BiliTube-modal-backdrop"></div>
    <div class="BiliTube-modal-dialog">
      <div class="BiliTube-modal-header">
        <div class="BiliTube-modal-title" id="BiliTube-modal-title"></div>
        <button
          type="button"
          class="BiliTube-modal-close"
          data-action="modal-close"
          aria-label="关闭"
        >
          ×
        </button>
      </div>
      <div class="BiliTube-modal-body" id="BiliTube-modal-body"></div>
      <div class="BiliTube-modal-actions">
        <button type="button" class="BiliTube-modal-btn BiliTube-modal-btn-secondary" data-action="modal-cancel">取消</button>
        <button type="button" class="BiliTube-modal-btn BiliTube-modal-btn-primary" data-action="modal-confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="js/loading.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/history.js"></script>
  <script src="js/favorate.js"></script>
  <script src="js/love.js"></script>
  <script src="js/coin.js"></script>
  <script src="js/home.js"></script>
  <script src="js/subscribe.js"></script>
  <script src="js/search.js"></script>
  <script src="js/player.js"></script>
  <script src="js/search-suggest.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
